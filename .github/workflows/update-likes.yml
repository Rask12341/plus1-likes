name: Update like count

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual update

permissions:
  contents: write             # lets the built-in token commit likes.json - no personal token needed

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_likes.py
      - name: Commit likes.json if it changed
        run: |
          git config user.name "like-counter"
          git config user.email "like-counter@users.noreply.github.com"
          git add likes.json
          git diff --cached --quiet || (git commit -m "likes: $(cat likes.json)" && git push)
